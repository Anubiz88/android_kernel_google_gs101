name: Build BluRaviole Pixel 6 Kernel

on:
  workflow_dispatch:
  workflow_call:  # This allows this workflow to be called from another workflow
  
jobs:
  build-kernel-a15-gs101-kernelsu-susfs:
    runs-on: ubuntu-latest

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Installing dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu
      - name: Set CONFIG Environment Variable
        run: |
          CONFIG="android_kernel_google_gs101"
          
          # Set CONFIG as an environment variable for future steps
          echo "CONFIG=$CONFIG" >> $GITHUB_ENV
          
          echo "CONFIG set to: $CONFIG"
      - name: Clone AnyKernel3 and Other Dependencies
        run: |
          echo "Cloning AnyKernel3 and other dependencies..."
    
          # Define the branch names using the matrix values
          ANYKERNEL_BRANCH="riri"
          SUSFS_BRANCH="gki-android14-6.1"

          # Debug print the branches
          echo "Using branch for AnyKernel3: $ANYKERNEL_BRANCH"
          # Clone repositories using the branch names
          git clone https://github.com/RiRiRawrZ615/AnyKernel3.git -b "$ANYKERNEL_BRANCH"
          git clone https://github.com/TheWildJames/kernel_patches.git
          git clone https://github.com/Anubiz88/android_kernel_google_gs101 -b android-gs-raviole-6.1-android15-qpr2
      
      - name: Add KernelSU
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"
          
          echo "Adding KernelSU..."
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
    
      
      - name: Apply KSU Hooks
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"
          # Apply additional patch
          cp ../kernel_patches/next/next_hooks.patch ./
          patch -p1 --fuzz=3 < ./next_hooks.patch
          #cp ../kernel_patches/next/syscall64_hooks.patch ./
          #patch -p1 --fuzz=3 < ./syscall64_hooks.patch
          
      - name: Apply Hide Stuff Patches
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"
          # Apply additional patch
          cp ../kernel_patches/69_hide_stuff.patch ./
          patch -p1 -F 3 < 69_hide_stuff.patch
          
      - name: Apply KernelSU & SUSFS SUltan Fixes
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"
          # Apply additional patch
          sed -i "s/poofed_size: '%u'/poofed_size: '%llu'/g" ./fs/susfs.c
          sed -i "s/length of string: %u/length of string: %lu/g" ./fs/susfs.c
          cp ../kernel_patches/mount.h_fix.patch ./
          patch -p1 --fuzz=3 < ./mount.h_fix.patch
          cp ../kernel_patches/sched.h_fix.patch ./
          patch -p1 --fuzz=3 < ./sched.h_fix.patch
          cp ../kernel_patches/user.h_fix.patch ./
          patch -p1 --fuzz=3 < ./user.h_fix.patch

      
         sed -i "s/poofed_size: '%u'/poofed_size: '%llu'/g" ./fs/susfs.c
          sed -i "s/length of string: %u/length of string: %lu/g" ./fs/susfs.c

    
      - name: Download and Extract Toolchain
        run: |
          TOOLCHAIN_TAR="x86_64-gcc-14.2.0-nolibc-aarch64-linux.tar.gz"
          TOOLCHAIN_DIR="gcc-14.2.0-nolibc/aarch64-linux"
          # Download the toolchain
          wget https://mirrors.edge.kernel.org/pub/tools/crosstool/files/bin/x86_64/14.2.0/$TOOLCHAIN_TAR
          
          # Extract the toolchain
          tar -xzf $TOOLCHAIN_TAR
          # Set the correct toolchain path
          TOOLCHAIN_PATH="$PWD/$TOOLCHAIN_DIR"
          # Ensure the toolchain directory exists
          if [ ! -d "$TOOLCHAIN_PATH" ]; then
            echo "Error: Toolchain directory not found!"
            exit 1
          fi
          # Export environment variables
          echo "TOOLCHAIN_PATH=$TOOLCHAIN_PATH" >> $GITHUB_ENV
          echo "CC=$TOOLCHAIN_PATH/bin/aarch64-linux-gcc" >> $GITHUB_ENV
          echo "CROSS_COMPILE=$TOOLCHAIN_PATH/bin/aarch64-linux-" >> $GITHUB_ENV
          echo "PATH=$TOOLCHAIN_PATH/bin:$PATH" >> $GITHUB_ENV
      - name: Verify Toolchain
        run: |
          $CC --version
      - name: Build the Kernel
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"
          
          echo "Building the kernel..."
          make raviole_defconfig -j$(nproc --all)
          make -j$(nproc --all)
      #- name: Upload Artifact
      #  uses: actions/upload-artifact@v4
      #  with:
      #    name: my-artifact
      #    path: android_kernel_google_gs101

      - name: Copy Images
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"
          echo "Copying Image.lz4 and concatenating DTB files..."
          cp ./out/arch/arm64/boot/Image.lz4 ../AnyKernel3/Image.lz4
          cp ./out/arch/arm64/boot/dts/google/dtbo.img ../AnyKernel3/dtbo.img
      - name: Create ZIP Files for Different Formats
        run: |
          echo "Navigating to AnyKernel3 directory..."
          cd ./AnyKernel3
          # Zip the files in the AnyKernel3 directory with a new naming convention
          ZIP_NAME="BluRaviole_KSU_NEXT_DEV_SUSFS.zip"
          echo "Creating zip file $ZIP_NAME..."
          zip -r "../$ZIP_NAME" ./*
          
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-gs101
          path: BluRaviole_KSU_NEXT_DEV_SUSFS.zip
