name: Build BluRaviole Pixel 6 Kernel Android 15 (6.1.130)

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-kernel-a15-gs101-kernelsu-susfs:
    runs-on: ubuntu-latest

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Installing dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu
          
      - name: Set CONFIG Environment Variable
        run: |
          CONFIG="android_kernel_google_gs101"
          echo "CONFIG=$CONFIG" >> $GITHUB_ENV
          echo "CONFIG set to: $CONFIG"
          
      - name: Clone Repositories
        run: |
          ANYKERNEL_BRANCH="riri"
          SUSFS_BRANCH="gki-android14-6.1"
          
          git clone https://github.com/RiRiRawrZ615/AnyKernel3.git -b "$ANYKERNEL_BRANCH"
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b "$SUSFS_BRANCH"
          git clone https://github.com/TheWildJames/kernel_patches.git
          git clone https://github.com/Anubiz88/android_kernel_google_gs101 -b android-gs-raviole-6.1-android15-qpr2
      
      - name: Add KernelSU
        run: |
          cd "$CONFIG"
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
      
      - name: Apply SUSFS Patches
        run: |
          cd "$CONFIG"
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch ./
          cp ../susfs4ksu/kernel_patches/fs/* ./fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/
          
          cd ./KernelSU-Next
          cp ../../kernel_patches/next/kernel-patch-susfs-v1.5.7-to-KernelSU-Next.patch ./
          patch -p1 --forward < kernel-patch-susfs-v1.5.7-to-KernelSU-Next.patch || true
          
          cd ..
          patch -p1 < 50_add_susfs_in_gki-android14-6.1.patch || true
      
      - name: Apply KSU Hooks
        run: |
          cd "$CONFIG"
          cp ../kernel_patches/next/next_hooks.patch ./
          patch -p1 --fuzz=3 < ./next_hooks.patch
          
      - name: Apply Hide Stuff Patches
        run: |
          cd "$CONFIG"
          cp ../kernel_patches/69_hide_stuff.patch ./
          patch -p1 -F 3 < 69_hide_stuff.patch
          
      - name: Apply KernelSU & SUSFS Fixes
        run: |
          cd "$CONFIG"
          sed -i "s/poofed_size: '%u'/poofed_size: '%llu'/g" ./fs/susfs.c
          sed -i "s/length of string: %u/length of string: %lu/g" ./fs/susfs.c

      - name: Configure Kernel
        run: |
          cd "$CONFIG"
          echo "CONFIG_KSU=y" >> ./arch/arm64/configs/raviole_defconfig
          echo "CONFIG_KSU_WITH_KPROBES=n" >> ./arch/arm64/configs/raviole_defconfig
          # SUSFS configuration entries maintained from original
          
      - name: Setup Toolchain
        run: |
          TOOLCHAIN_TAR="x86_64-gcc-14.2.0-nolibc-aarch64-linux.tar.gz"
          wget https://mirrors.edge.kernel.org/pub/tools/crosstool/files/bin/x86_64/14.2.0/$TOOLCHAIN_TAR
          tar -xzf $TOOLCHAIN_TAR
          echo "PATH=$PWD/gcc-14.2.0-nolibc/aarch64-linux/bin:$PATH" >> $GITHUB_ENV
      
      - name: Build Kernel
        run: |
          cd "$CONFIG"
          make raviole_defconfig -j$(nproc --all)
          make -j$(nproc --all)
      
      - name: Package Artifacts
        run: |
          cd "$CONFIG"
          cp ./out/arch/arm64/boot/Image.lz4 ../AnyKernel3/
          cp ./out/arch/arm64/boot/dts/google/dtbo.img ../AnyKernel3/
          
          cd ../AnyKernel3
          zip -r "../BluRaviole_KSU_NEXT_A15_6.1.130_SUSFS.zip" ./*
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-gs101-a15-6.1.130
          path: BluRaviole_KSU_NEXT_A15_6.1.130_SUSFS.zip

