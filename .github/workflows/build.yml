name: Build BluRaviole Pixel 6 Kernel (Android 15)

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-kernel-a15-gs101-kernelsu-susfs:
    runs-on: ubuntu-latest

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Installing dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu libssl-dev flex bison libelf-dev

      - name: Set CONFIG Environment Variable
        run: |
          CONFIG="android_kernel_google_gs101"
          echo "CONFIG=$CONFIG" >> $GITHUB_ENV
          echo "CONFIG set to: $CONFIG"

      - name: Clone Repositories
        run: |
          ANYKERNEL_BRANCH="riri"
          SUSFS_BRANCH="gki-android14-6.1-latest"  # Updated branch for 6.1 compatibility
          
          git clone https://github.com/RiRiRawrZ615/AnyKernel3.git -b "$ANYKERNEL_BRANCH"
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b "$SUSFS_BRANCH"
          git clone https://github.com/TheWildJames/kernel_patches.git
          git clone https://github.com/Anubiz88/android_kernel_google_gs101 -b android-gs-raviole-6.1-android15-qpr2

      - name: Add KernelSU
        run: |
          cd "$CONFIG"
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next

      - name: Apply SUSFS Patches
        run: |
          cd "$CONFIG"
          cp ../susfs4ksu/kernel_patches/60_add_susfs_in_gki-android14-6.1.patch ./  # Updated patch file
          patch -p1 < 60_add_susfs_in_gki-android14-6.1.patch
          
          # Fix format specifiers
          sed -i "s/poofed_size: '%u'/poofed_size: '%llu'/g" ./fs/susfs.c
          sed -i "s/length of string: %u/length of string: %lu/g" ./fs/susfs.c

      - name: Configure Build
        run: |
          cd "$CONFIG"
          echo "CONFIG_KSU=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_DEBUG=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_COMPAT=y" >> ./arch/arm64/configs/gs101_defconfig

      - name: Setup Clang Toolchain
        run: |
          git clone https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android-14.0.0_r31 clang
          echo "CLANG_PATH=$PWD/clang/clang-r450784d/bin/" >> $GITHUB_ENV
          echo "PATH=$PWD/clang/clang-r450784d/bin/:$PATH" >> $GITHUB_ENV

      - name: Build Kernel
        run: |
          cd "$CONFIG"
          make O=out ARCH=arm64 CC=$CLANG_PATH/clang CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-android- LD=ld.lld AS=llvm-as AR=llvm-ar \
              gs101_defconfig
          
          make -j$(nproc) O=out ARCH=arm64 CC=$CLANG_PATH/clang CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-android- LD=ld.lld AS=llvm-as AR=llvm-ar

      - name: Package Artifacts
        run: |
          cp "$CONFIG/out/arch/arm64/boot/Image.lz4" AnyKernel3/
          cp "$CONFIG/out/arch/arm64/boot/dts/google/dtbo.img" AnyKernel3/
          
          cd AnyKernel3
          zip -r ../BluRaviole_KSU_NEXT_A15_SUSFS.zip ./*

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-a15-gs101
          path: BluRaviole_KSU_NEXT_A15_SUSFS.zip

